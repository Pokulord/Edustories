<div id="mobileMenu" class="fixed inset-0
      dark:bg-[#070b1a]/[.97] bg-white/[.97] backdrop-blur-2xl
      flex flex-col items-center justify-center
      gap-7 text-xl dark:text-blue-200 text-blue-800
      opacity-0 pointer-events-none
      transition-all duration-500 z-40">

  <a href="{% url 'biblio' %}" class="dark:hover:text-blue-400 hover:text-blue-600 transition font-semibold dark:text-blue-100">Главная</a>
  <a href="#contracts" class="dark:hover:text-blue-400 hover:text-blue-600 transition">Контракты</a>
  <a href="#" class="dark:hover:text-blue-400 hover:text-blue-600 transition">Бестиарий</a>
  <a href="#" class="dark:hover:text-blue-400 hover:text-blue-600 transition">Алхимия</a>
  <a href="#" class="dark:hover:text-blue-400 hover:text-blue-600 transition">Таверна</a>
  <a href="#" class="text-amber-500 dark:text-amber-400 dark:hover:text-amber-300 hover:text-amber-600 transition">Книгочей</a>

  <div class="flex gap-4 mt-4">
    {% if user.is_authenticated %}
      <form method="post" action="{% url 'users:logout' %}">
        {% csrf_token %}
        <button type="submit"
                class="px-6 py-2.5 text-base font-semibold uppercase tracking-wider rounded transition-all duration-300
                       btn-gold text-[#1a0e00] cursor-pointer">Выйти</button>
      </form>
    {% else %}
      <a href="{% url 'users:login' %}"
         class="px-6 py-2.5 text-base font-semibold uppercase tracking-wider rounded border-2 transition-all duration-300
                dark:border-blue-300/40 dark:text-blue-100 dark:hover:bg-blue-400/10
                border-blue-700 text-blue-800 hover:bg-blue-50">Войти</a>
      <a href="{% url 'users:register' %}"
         class="px-6 py-2.5 text-base font-semibold uppercase tracking-wider rounded transition-all duration-300
                btn-gold text-[#1a0e00]">Регистрация</a>
    {% endif %}
  </div>
</div>
