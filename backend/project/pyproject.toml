[project]
name = "backend"
version = "0.1.0"
description = "Backend for Edustories project (educational platform with cources)"
authors = [
    {name = "Svyat"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "django (>=6.0.6,<7.0.0)",
    "psycopg2 (>=2.9.12,<3.0.0)",
    "django-environ (>=0.14.0,<0.15.0)",
    "pre-commit (>=4.6.0,<5.0.0)",
    "pillow (>=12.3.0,<13.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
