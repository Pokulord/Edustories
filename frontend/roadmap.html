<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Дорожная карта — Путь Ведьмака</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Raleway', sans-serif;
      background-color: #081410;
      overflow-x: hidden;
    }
    .title-font { font-family: 'Cinzel', serif; }

    /* ─── Скролл-обёртка ─── */
    .map-scroll {
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      cursor: grab;
      scrollbar-width: thin;
      scrollbar-color: rgba(52,211,153,0.45) rgba(8,20,16,0.5);
      -webkit-overflow-scrolling: touch;
    }
    .map-scroll:active { cursor: grabbing; }
    .map-scroll::-webkit-scrollbar { height: 5px; }
    .map-scroll::-webkit-scrollbar-track { background: rgba(8,20,16,0.5); }
    .map-scroll::-webkit-scrollbar-thumb {
      background: rgba(52,211,153,0.45);
      border-radius: 3px;
    }
    .map-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(52,211,153,0.75);
    }

    /* ─── Внутренний холст ─── */
    .map-canvas {
      position: relative;
      height: clamp(420px, 56vh, 680px);
      /* width задаётся JS */
    }

    .map-bg {
      position: absolute;
      inset: 0;
      background: #081410 url('./images/roadmap_back.png') center / cover no-repeat;
      z-index: 0;
    }

    /* ─── Картинки узлов ─── */
    .node-img {
      position: absolute;
      top: 0;
      height: 100%;
      background-size: cover;
      background-position: center top;
      pointer-events: none;
      z-index: 1;
      -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 22%, #000 78%, transparent 100%);
              mask-image: linear-gradient(to right, transparent 0%, #000 22%, #000 78%, transparent 100%);
    }
    .node-img.is-first {
      -webkit-mask-image: linear-gradient(to right, #000 0%, #000 55%, transparent 100%);
              mask-image: linear-gradient(to right, #000 0%, #000 55%, transparent 100%);
    }
    .node-img.is-last {
      -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 45%, #000 100%);
              mask-image: linear-gradient(to right, transparent 0%, #000 45%, #000 100%);
    }

    .map-fade {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        rgba(8,20,16,0.78) 0%,
        transparent 16%,
        transparent 78%,
        rgba(8,20,16,0.88) 100%
      );
    }

    /* ─── SVG путь ─── */
    .path-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
      overflow: visible;
    }
    @keyframes dash-flow { to { stroke-dashoffset: -40; } }
    .dash-gold {
      stroke-dasharray: 14 9;
      animation: dash-flow 1.8s linear infinite;
    }
    .dash-gray { stroke-dasharray: 14 9; }

    /* ─── Узел (иконка + текст) ─── */
    .map-node {
      position: absolute;   /* ← абсолют, единая СК */
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
      z-index: 20;
      /* left + bottom + transform задаются JS */
      width: 160px;
      pointer-events: none;
    }

    .node-icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 2px solid;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .node-icon.completed {
      border-color: #34d399;
      background: rgba(13,35,24,0.88);
      box-shadow: 0 0 18px rgba(52,211,153,0.5), 0 0 40px rgba(52,211,153,0.2);
      color: #34d399;
    }
    .node-icon.active {
      border-color: #fbbf24;
      background: rgba(26,20,8,0.88);
      box-shadow: 0 0 18px rgba(251,191,36,0.5), 0 0 40px rgba(251,191,36,0.2);
      color: #fbbf24;
    }
    .node-icon.locked {
      border-color: #374151;
      background: rgba(17,17,24,0.7);
      color: #6b7280;
    }

    .node-title {
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.35;
    }
    .node-status {
      font-size: 11px;
      margin-top: 4px;
    }

    /* ─── Стрелки навигации ─── */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 40;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(52,211,153,0.35);
      background: rgba(8,20,16,0.75);
      color: #34d399;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.2s, opacity 0.2s;
      opacity: 0;
      pointer-events: none;
    }
    .nav-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .nav-btn:hover { background: rgba(52,211,153,0.15); }
    .nav-btn.left  { left: 12px; }
    .nav-btn.right { right: 12px; }

    .quote-box {
      border: 1px solid rgba(52,211,153,0.3);
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(8px);
    }

    .map-section-wrap {
      position: relative;
    }

    @media (max-width: 640px) {
      .map-node { width: 120px; }
      .node-icon { width: 42px; height: 42px; }
      .node-title { font-size: 11px; }
    }
  </style>
</head>
<body>

  <!-- ШАПКА -->
  <div class="w-full text-center pt-12 pb-10 px-4">
    <p class="text-[#4ade80] tracking-[0.4em] text-xs uppercase mb-4 title-font">Путь ведьмака</p>
    <h1 class="text-4xl sm:text-6xl font-bold mb-6 leading-tight">
      <span class="text-white title-font">Дорожная </span>
      <span class="text-[#d4a843] title-font">карта</span>
    </h1>
    <p class="text-gray-400 text-sm sm:text-base max-w-lg mx-auto leading-relaxed">
      Путь к мастерству долог и полон испытаний. Следи за этапами развития<br class="hidden sm:block"/>
      Академии и будь частью великого наследия.
    </p>
  </div>

  <!-- КАРТА -->
  <div class="map-section-wrap">
    <!-- Стрелки -->
    <button class="nav-btn left"  id="btnLeft"  aria-label="Влево">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
      </svg>
    </button>
    <button class="nav-btn right" id="btnRight" aria-label="Вправо">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
      </svg>
    </button>

    <div class="map-scroll" id="mapScroll">
      <div class="map-canvas" id="mapCanvas">
        <div class="map-bg"></div>
        <div id="imagesLayer"></div>
        <div class="map-fade"></div>
        <svg class="path-svg" id="pathSvg" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="nodesLayer"></div>
      </div>
    </div>
  </div>

  <!-- ЦИТАТА -->
  <div class="w-full flex justify-center px-4 py-14">
    <div class="quote-box rounded-lg px-6 sm:px-16 py-4 max-w-2xl w-full flex items-center justify-center gap-4">
      <p class="text-gray-300 text-xs sm:text-sm text-center italic leading-relaxed">
        «Каждая страница приближает к истине, каждый шаг — к себе настоящему»
      </p>
      <svg class="w-5 h-5 text-[#34d399] flex-shrink-0 opacity-50" fill="currentColor" viewBox="0 0 24 24">
        <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
      </svg>
    </div>
  </div>

<script>
/* ════════════════════════════════════════════════════════════
   ДАННЫЕ — чтобы добавить узел, добавь объект сюда
════════════════════════════════════════════════════════════ */
const NODES = [
  {
    title: 'Долина\nПервых Строк',
    status: 'completed',       // completed | active | locked
    statusLabel: 'Пройдено',
    image: './images/dolina.png',
    wave: 0.85,                // 0 = высоко, 1 = низко (волна пути)
  },
  {
    title: 'Замок\nСпящего Дракона',
    status: 'completed',
    statusLabel: 'Пройдено',
    image: './images/dragon.png',
    wave: 0.25,
  },
  {
    title: 'Лес\nШёпота и Теней',
    status: 'completed',
    statusLabel: 'Пройдено',
    image: './images/forest.png',
    wave: 0.55,
  },
  {
    title: 'Океан\nНескончаемых Историй',
    status: 'active',
    statusLabel: 'В процессе',
    image: './images/ocean.png',
    wave: 0.20,
  },
  {
    title: 'Город\nЖивых Зеркал',
    status: 'locked',
    statusLabel: 'Скоро',
    image: './images/mirrors.png',
    wave: 0.50,
  },
  {
    title: 'Библиотека\nВечности',
    status: 'locked',
    statusLabel: 'Скоро',
    image: './images/library.png',
    wave: 0.45,
  },
];

/* ════════════════════════════════════════════════════════════
   НАСТРОЙКИ
════════════════════════════════════════════════════════════ */
const CFG = {
  // Желаемый шаг между центрами узлов (px).
  // Если узлы не влезают в экран — используется он (появится скролл).
  // Если влезают — шаг увеличивается, чтобы заполнить ширину.
  nodeStep: 500,

  // Минимальный шаг (не сжимать сильнее)
  minStep: 180,

  // Боковые поля от края холста до центра крайнего узла
  sidePad: 130,

  // Ширина картинки = step * imgRatio
  imgRatio: 1.85,

  // Вертикаль иконки: доля высоты холста от низа
  // iconBottomMin — когда wave=1 (низко)
  // iconBottomMax — когда wave=0 (высоко)
  iconBottomMin: 0.08,  // 8% высоты от низа
  iconBottomMax: 0.38,  // 38% высоты от низа

  // Размер иконки (для расчёта центра пути)
  iconSize: 52,
};

/* ════════════════════════════════════════════════════════════
   РЕНДЕР
════════════════════════════════════════════════════════════ */
const scrollEl  = document.getElementById('mapScroll');
const canvasEl  = document.getElementById('mapCanvas');
const imgsLayer = document.getElementById('imagesLayer');
const nodesLayer= document.getElementById('nodesLayer');
const pathSvg   = document.getElementById('pathSvg');
const btnLeft   = document.getElementById('btnLeft');
const btnRight  = document.getElementById('btnRight');

const ICONS = {
  check: `<svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>`,
  lock:  `<svg width="17" height="17" fill="currentColor" viewBox="0 0 24 24"><path d="M12 1C8.676 1 6 3.676 6 7v1H4v15h16V8h-2V7c0-3.324-2.676-6-6-6zm0 2c2.276 0 4 1.724 4 4v1H8V7c0-2.276 1.724-4 4-4zm0 9a2 2 0 110 4 2 2 0 010-4z"/></svg>`,
};

function statusColor(s) {
  return { completed: '#34d399', active: '#fbbf24', locked: '#6b7280' }[s];
}

function render() {
  const n = NODES.length;
  if (!n) return;

  const viewW  = scrollEl.clientWidth;
  const mapH   = canvasEl.clientHeight;

  /* ── 1. Адаптивный шаг ── */
  // Сколько места нужно при желаемом step
  const neededAtStep = CFG.sidePad * 2 + CFG.nodeStep * (n - 1);

  let step;
  if (neededAtStep <= viewW) {
    // Всё влезает — растягиваем, чтобы заполнить экран
    step = Math.max(CFG.minStep, (viewW - CFG.sidePad * 2) / Math.max(n - 1, 1));
  } else {
    // Не влезает — фиксированный step, будет скролл
    step = CFG.nodeStep;
  }

  const totalW = CFG.sidePad * 2 + step * (n - 1);
  canvasEl.style.width = totalW + 'px';

  /* ── 2. Координаты центров ── */
  // Единая функция: X-центр i-го узла
  const cx = (i) => CFG.sidePad + i * step;

  // Y-центр иконки (от верха холста)
  // bottom_px = mapH * lerp(iconBottomMax, iconBottomMin, wave)
  // icon center from top = mapH - bottom_px - iconSize/2
  const iconCY = (wave) => {
    const bottomFrac = CFG.iconBottomMax + (CFG.iconBottomMin - CFG.iconBottomMax) * wave;
    // wait: wave=0 → high → large bottom offset
    // wave=1 → low  → small bottom offset
    const bottomPx = mapH * (CFG.iconBottomMax * (1 - wave) + CFG.iconBottomMin * wave);
    return mapH - bottomPx - CFG.iconSize / 2;
  };

  const iconBottom = (wave) => {
    return mapH * (CFG.iconBottomMax * (1 - wave) + CFG.iconBottomMin * wave);
  };

  /* ── 3. Картинки ── */
  imgsLayer.innerHTML = '';
  const imgW = Math.round(step * CFG.imgRatio);

  NODES.forEach((node, i) => {
    const el = document.createElement('div');
    el.className = 'node-img'
      + (i === 0     ? ' is-first' : '')
      + (i === n - 1 ? ' is-last'  : '');
    el.style.left = (cx(i) - imgW / 2) + 'px';
    el.style.width = imgW + 'px';
    el.style.backgroundImage = `url('${node.image}')`;
    imgsLayer.appendChild(el);
  });

  /* ── 4. SVG путь — через центры иконок ── */
  // viewBox = реальные пиксели холста → path совпадает 1:1
  pathSvg.setAttribute('viewBox', `0 0 ${totalW} ${mapH}`);
  pathSvg.setAttribute('width', totalW);
  pathSvg.setAttribute('height', mapH);

  // Точки пути = центры иконок
  const pts = NODES.map((node, i) => ({
    x: cx(i),
    y: iconCY(node.wave),
    status: node.status,
  }));

  // Индекс, с которого начинается locked-сегмент
  let lockStart = NODES.findIndex(nd => nd.status === 'locked');
  if (lockStart === -1) lockStart = n; // все открыты

  function makePath(from, to) {
    if (from >= to) return '';
    let d = `M ${pts[from].x} ${pts[from].y}`;
    for (let i = from; i < to; i++) {
      const a = pts[i], b = pts[i + 1];
      const cpx = (a.x + b.x) / 2;
      d += ` C ${cpx} ${a.y}, ${cpx} ${b.y}, ${b.x} ${b.y}`;
    }
    return d;
  }

  // Золотой: от 0 до lockStart (включительно соединяем с первым locked, если есть)
  const goldEnd = lockStart > 0 ? lockStart : 0;
  // Серый: от (lockStart-1) или lockStart до конца
  const grayStart = lockStart > 0 ? lockStart - 1 : lockStart;

  let svgHTML = '';
  if (goldEnd > 0) {
    svgHTML += `<path d="${makePath(0, goldEnd)}" fill="none" stroke="#d4a843" stroke-width="2.5" stroke-linecap="round" class="dash-gold"/>`;
  }
  if (grayStart < n - 1) {
    svgHTML += `<path d="${makePath(grayStart, n - 1)}" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" class="dash-gray"/>`;
  }
  pathSvg.innerHTML = svgHTML;

  /* ── 5. Узлы (иконка + текст) — absolute, та же СК ── */
  nodesLayer.innerHTML = '';

  NODES.forEach((node, i) => {
    const el = document.createElement('div');
    el.className = 'map-node';
    if (node.status === 'locked') el.style.opacity = '0.55';

    // Центрируем по X через left + translateX(-50%)
    el.style.left   = cx(i) + 'px';
    el.style.bottom = iconBottom(node.wave) + 'px';
    el.style.transform = 'translateX(-50%)';

    const color = statusColor(node.status);
    const icon  = node.status === 'locked' ? ICONS.lock : ICONS.check;
    const title = node.title.replace(/\n/g, '<br>');
    const weight = node.status === 'active' ? '600' : '400';

    el.innerHTML = `
      <div class="node-icon ${node.status}">${icon}</div>
      <div>
        <p class="node-title">${title}</p>
        <p class="node-status" style="color:${color};font-weight:${weight}">${node.statusLabel}</p>
      </div>
    `;
    nodesLayer.appendChild(el);
  });

  updateNavButtons();
}

/* ════════════════════════════════════════════════════════════
   СКРОЛЛ / DRAG / СТРЕЛКИ
════════════════════════════════════════════════════════════ */
function updateNavButtons() {
  const maxScroll = scrollEl.scrollWidth - scrollEl.clientWidth;
  const hasScroll = maxScroll > 4;
  btnLeft.classList.toggle('visible',  hasScroll && scrollEl.scrollLeft > 4);
  btnRight.classList.toggle('visible', hasScroll && scrollEl.scrollLeft < maxScroll - 4);
}

scrollEl.addEventListener('scroll', updateNavButtons, { passive: true });

btnLeft.addEventListener('click',  () => scrollEl.scrollBy({ left: -CFG.nodeStep, behavior: 'smooth' }));
btnRight.addEventListener('click', () => scrollEl.scrollBy({ left:  CFG.nodeStep, behavior: 'smooth' }));

/* Drag-to-scroll */
let dragging = false, dragStartX = 0, scrollStart = 0;

scrollEl.addEventListener('mousedown', e => {
  dragging = true;
  dragStartX = e.pageX;
  scrollStart = scrollEl.scrollLeft;
  scrollEl.style.cursor = 'grabbing';
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  e.preventDefault();
  scrollEl.scrollLeft = scrollStart - (e.pageX - dragStartX);
});
window.addEventListener('mouseup', () => {
  dragging = false;
  scrollEl.style.cursor = 'grab';
});

/* ════════════════════════════════════════════════════════════
   INIT + RESIZE
════════════════════════════════════════════════════════════ */
render();

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 120);
});
</script>
</body>
</html>
