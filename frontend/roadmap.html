<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Дорожная карта</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Raleway', sans-serif;
      background-color: #050a0a;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(20, 40, 30, 0.6) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 50%, rgba(40, 30, 15, 0.5) 0%, transparent 60%),
        linear-gradient(180deg, rgba(5, 10, 10, 0.92) 0%, rgba(8, 16, 14, 0.85) 40%, rgba(5, 10, 10, 0.95) 100%),
        url('./images/roadmap_page_background.jpg') center / cover no-repeat fixed;

      background-color: #050a0a;
    }

    .title-font {
      font-family: 'Cinzel', serif;
    }

    .map-scroll {
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      cursor: grab;
      scrollbar-width: thin;
      scrollbar-color: rgba(197, 166, 124, 0.45) rgba(5, 10, 10, 0.5);
      -webkit-overflow-scrolling: touch;
    }

    .map-scroll:active {
      cursor: grabbing;
    }

    .map-scroll::-webkit-scrollbar {
      height: 5px;
    }

    .map-scroll::-webkit-scrollbar-track {
      background: rgba(5, 10, 10, 0.5);
    }

    .map-scroll::-webkit-scrollbar-thumb {
      background: rgba(197, 166, 124, 0.45);
      border-radius: 3px;
    }

    .map-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(197, 166, 124, 0.75);
    }

    .map-canvas {
      position: relative;
      height: clamp(420px, 56vh, 680px);
    }

    .map-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: #050a0a url('./images/roadmap_back.png') center / cover no-repeat;
    }

    .node-img {
      position: absolute;
      top: 0;
      height: 100%;
      background-size: cover;
      background-position: center top;
      pointer-events: none;
      z-index: 1;
      -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 22%, #000 78%, transparent 100%);
      mask-image: linear-gradient(to right, transparent 0%, #000 22%, #000 78%, transparent 100%);
    }

    .node-img.is-first {
      -webkit-mask-image: linear-gradient(to right, #000 0%, #000 55%, transparent 100%);
      mask-image: linear-gradient(to right, #000 0%, #000 55%, transparent 100%);
    }

    .node-img.is-last {
      -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 45%, #000 100%);
      mask-image: linear-gradient(to right, transparent 0%, #000 45%, #000 100%);
    }

    .node-img.is-locked {
      filter: brightness(0.5) saturate(0.55);
    }

    .map-fade {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: linear-gradient(to bottom,
          rgba(5, 10, 10, 0.82) 0%, transparent 16%,
          transparent 78%, rgba(5, 10, 10, 0.92) 100%);
    }

    .fog-layer {
      position: absolute;
      top: 0;
      bottom: 0;
      z-index: 25;
      pointer-events: none;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to right,
          transparent 0%, rgba(0, 0, 0, .2) 5%, rgba(0, 0, 0, .65) 15%, #000 28%, #000 100%);
      mask-image: linear-gradient(to right,
          transparent 0%, rgba(0, 0, 0, .2) 5%, rgba(0, 0, 0, .65) 15%, #000 28%, #000 100%);
    }

    .fog-sprite {
      position: absolute;
      background-image: url('./images/fog.png');
      background-repeat: no-repeat;
      background-size: 100% 100%;
      filter: invert(1) brightness(1.1) contrast(0.95);
      mix-blend-mode: screen;
      will-change: transform;
    }

    @keyframes fog-drift-a {
      0% {
        transform: translate3d(0, 0, 0) scaleX(1);
      }

      50% {
        transform: translate3d(-3%, -8px, 0) scaleX(1.05);
      }

      100% {
        transform: translate3d(0, 0, 0) scaleX(1);
      }
    }

    @keyframes fog-drift-b {
      0% {
        transform: translate3d(0, 0, 0) scaleX(1.04);
      }

      50% {
        transform: translate3d(4%, 10px, 0) scaleX(1);
      }

      100% {
        transform: translate3d(0, 0, 0) scaleX(1.04);
      }
    }

    @keyframes fog-drift-c {
      0% {
        transform: translate3d(-2%, 4px, 0) scaleX(1);
      }

      50% {
        transform: translate3d(3%, -6px, 0) scaleX(1.07);
      }

      100% {
        transform: translate3d(-2%, 4px, 0) scaleX(1);
      }
    }

    .path-svg {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 10;
      pointer-events: none;
      overflow: visible;
    }

    @keyframes dash-flow {
      to {
        stroke-dashoffset: -40;
      }
    }

    .dash-gold {
      stroke-dasharray: 14 9;
      animation: dash-flow 1.8s linear infinite;
    }

    .dash-gray {
      stroke-dasharray: 14 9;
    }

    .map-node {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
      z-index: 20;
      width: 160px;
      pointer-events: none;
      transform: translateX(-50%);
    }

    .node-icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 2px solid;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .node-icon.completed {
      border-color: #c5a67c;
      background: rgba(10, 18, 14, 0.88);
      color: #c5a67c;
      box-shadow: 0 0 18px rgba(197, 166, 124, 0.45), 0 0 40px rgba(197, 166, 124, 0.2);
    }

    .node-icon.active {
      border-color: #d4a843;
      background: rgba(30, 22, 8, 0.9);
      color: #d4a843;
      box-shadow: 0 0 25px rgba(212, 168, 67, 0.6), 0 0 50px rgba(212, 168, 67, 0.25);
    }

    .node-icon.locked {
      border-color: #6b7280;
      background: rgba(16, 20, 20, 0.65);
      color: #b6bcc2;
      backdrop-filter: blur(2px);
    }

    .node-title {
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.35;
    }

    .node-status {
      font-size: 11px;
      margin-top: 4px;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 40;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(197, 166, 124, 0.35);
      background: rgba(5, 10, 10, 0.75);
      color: #c5a67c;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background .2s, opacity .2s;
      opacity: 0;
      pointer-events: none;
    }

    .nav-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .nav-btn:hover {
      background: rgba(197, 166, 124, 0.15);
    }

    .nav-btn.left {
      left: 12px;
    }

    .nav-btn.right {
      right: 12px;
    }

    .quote-box {
      border: 1px solid rgba(197, 166, 124, 0.3);
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(8px);
    }

    .map-section-wrap {
      position: relative;
    }

    @media (max-width: 640px) {
      .map-node {
        width: 120px;
      }

      .node-icon {
        width: 42px;
        height: 42px;
      }

      .node-title {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <div class="w-full text-center pt-12 pb-10 px-4">
    <p class="text-[#c5a67c] tracking-[0.4em] text-xs uppercase mb-4 title-font">Путь Книгочея</p>
    <h1 class="text-4xl sm:text-6xl font-bold mb-6 leading-tight">
      <span class="text-white title-font">Дорожная </span>
      <span class="text-[#d4b483] title-font">карта</span>
    </h1>
    <p class="text-gray-400 text-sm sm:text-base max-w-lg mx-auto leading-relaxed">
      Путь к мастерству долог и полон испытаний. Следи за этапами развития<br class="hidden sm:block" />
      Академии и будь частью великого наследия.
    </p>
  </div>

  <div class="map-section-wrap">
    <button class="nav-btn left" id="btnLeft" aria-label="Влево">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
      </svg>
    </button>
    <button class="nav-btn right" id="btnRight" aria-label="Вправо">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
      </svg>
    </button>

    <div class="map-scroll" id="mapScroll">
      <div class="map-canvas" id="mapCanvas">
        <div class="map-bg"></div>
        <div id="imagesLayer"></div>
        <div class="map-fade"></div>
        <div class="fog-layer" id="fogLayer" hidden></div>
        <svg class="path-svg" id="pathSvg" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="nodesLayer"></div>
      </div>
    </div>
  </div>

  <div class="w-full flex justify-center px-4 py-14">
    <div class="quote-box rounded-lg px-6 sm:px-16 py-4 max-w-2xl w-full flex items-center justify-center gap-4">
      <p class="text-gray-300 text-xs sm:text-sm text-center italic leading-relaxed">
        «Каждая страница приближает к истине, каждый шаг — к себе настоящему»
      </p>
      <svg class="w-5 h-5 text-[#c5a67c] flex-shrink-0 opacity-50" fill="currentColor" viewBox="0 0 24 24">
        <path
          d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" />
      </svg>
    </div>
  </div>

  <script>
    const NODES = [
      { title: 'Долина\nПервых Строк', status: 'completed', statusLabel: 'Пройдено', image: './images/dolina.png', wave: 0.85 },
      { title: 'Замок\nСпящего Дракона', status: 'completed', statusLabel: 'Пройдено', image: './images/dragon.png', wave: 0.25 },
      { title: 'Лес\nШёпота и Теней', status: 'completed', statusLabel: 'Пройдено', image: './images/forest.png', wave: 0.55 },
      { title: 'Океан\nНескончаемых Историй', status: 'active', statusLabel: 'В процессе', image: './images/ocean.png', wave: 0.20 },
      { title: 'Город\nЖивых Зеркал', status: 'locked', statusLabel: 'Скоро', image: './images/mirrors.png', wave: 0.50 },
      { title: 'Библиотека\nВечности', status: 'locked', statusLabel: 'Скоро', image: './images/library.png', wave: 0.45 },
    ];

    const CFG = {
      nodeStep: 550, minStep: 180, sidePad: 130, imgRatio: 1.9,
      iconBottomMin: 0.14, iconBottomMax: 0.42,
      fogLeadIn: 0.7,
    };

    const FOG_SPRITES = [
      { x: -0.15, y: 0.55, w: 0.70, h: 0.80, op: 0.75, anim: 'fog-drift-a', dur: 38, delay: 0, flip: false },
      { x: 0.25, y: 0.50, w: 0.75, h: 0.75, op: 0.70, anim: 'fog-drift-b', dur: 44, delay: -10, flip: true },
      { x: 0.55, y: 0.52, w: 0.65, h: 0.72, op: 0.68, anim: 'fog-drift-c', dur: 40, delay: -20, flip: false },
      { x: -0.10, y: 0.25, w: 0.80, h: 0.75, op: 0.60, anim: 'fog-drift-b', dur: 50, delay: -5, flip: true },
      { x: 0.20, y: 0.20, w: 0.85, h: 0.70, op: 0.55, anim: 'fog-drift-c', dur: 35, delay: -18, flip: false },
      { x: 0.50, y: 0.28, w: 0.75, h: 0.68, op: 0.52, anim: 'fog-drift-a', dur: 55, delay: -28, flip: true },
      { x: 0.00, y: -0.10, w: 0.85, h: 0.65, op: 0.45, anim: 'fog-drift-a', dur: 60, delay: -8, flip: false },
      { x: 0.30, y: -0.05, w: 0.80, h: 0.60, op: 0.40, anim: 'fog-drift-c', dur: 48, delay: -35, flip: true },
      { x: 0.60, y: -0.08, w: 0.70, h: 0.58, op: 0.38, anim: 'fog-drift-b', dur: 42, delay: -15, flip: false },
      { x: 0.10, y: 0.38, w: 0.90, h: 0.55, op: 0.50, anim: 'fog-drift-b', dur: 45, delay: -25, flip: false },
      { x: 0.40, y: 0.42, w: 0.80, h: 0.60, op: 0.48, anim: 'fog-drift-a', dur: 36, delay: -12, flip: true },
      { x: 0.70, y: 0.35, w: 0.75, h: 0.65, op: 0.45, anim: 'fog-drift-c', dur: 52, delay: -40, flip: false },
    ];

    const scrollEl = document.getElementById('mapScroll');
    const canvasEl = document.getElementById('mapCanvas');
    const imgsLayer = document.getElementById('imagesLayer');
    const nodesLayer = document.getElementById('nodesLayer');
    const pathSvg = document.getElementById('pathSvg');
    const fogLayer = document.getElementById('fogLayer');
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');

    const ICONS = {
      check: `<svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>`,
      lock: `<svg width="17" height="17" fill="currentColor" viewBox="0 0 24 24"><path d="M12 1C8.676 1 6 3.676 6 7v1H4v15h16V8h-2V7c0-3.324-2.676-6-6-6zm0 2c2.276 0 4 1.724 4 4v1H8V7c0-2.276 1.724-4 4-4zm0 9a2 2 0 110 4 2 2 0 010-4z"/></svg>`,
    };
    const statusColor = s => ({ completed: '#c5a67c', active: '#d4b483', locked: '#a8b0b6' }[s]);
    const getIconSize = () => window.matchMedia('(max-width:640px)').matches ? 42 : 52;

    function buildFog(fogLeft, fogW, fogH) {
      fogLayer.hidden = false;
      fogLayer.style.left = fogLeft + 'px';
      fogLayer.style.width = (fogW + 200) + 'px';
      fogLayer.innerHTML = '';

      FOG_SPRITES.forEach(s => {
        const el = document.createElement('div');
        el.className = 'fog-sprite';
        el.style.left = (s.x * fogW) + 'px';
        el.style.top = (s.y * fogH) + 'px';
        el.style.width = (s.w * fogW) + 'px';
        el.style.height = (s.h * fogH) + 'px';
        el.style.opacity = s.op;
        el.style.animation = `${s.anim} ${s.dur}s ease-in-out ${s.delay}s infinite`;
        if (s.flip) el.style.scale = '-1 1';
        fogLayer.appendChild(el);
      });
    }

    function hideFog() {
      fogLayer.hidden = true;
      fogLayer.innerHTML = '';
    }

    function render() {
      const n = NODES.length;
      if (!n) return;

      const viewW = scrollEl.clientWidth;
      const mapH = canvasEl.clientHeight;
      const iconSize = getIconSize();

      const needed = CFG.sidePad * 2 + CFG.nodeStep * (n - 1);
      const step = needed <= viewW
        ? Math.max(CFG.minStep, (viewW - CFG.sidePad * 2) / Math.max(n - 1, 1))
        : CFG.nodeStep;

      const totalW = CFG.sidePad * 2 + step * (n - 1);
      canvasEl.style.width = totalW + 'px';

      const cx = i => CFG.sidePad + i * step;
      const iconTop = wave => {
        const b = mapH * (CFG.iconBottomMax * (1 - wave) + CFG.iconBottomMin * wave);
        return mapH - b - iconSize;
      };

      imgsLayer.innerHTML = '';
      const imgW = Math.round(step * CFG.imgRatio);
      NODES.forEach((node, i) => {
        const el = document.createElement('div');
        el.className = 'node-img'
          + (i === 0 ? ' is-first' : '')
          + (i === n - 1 ? ' is-last' : '')
          + (node.status === 'locked' ? ' is-locked' : '');
        el.style.left = (cx(i) - imgW / 2) + 'px';
        el.style.width = imgW + 'px';
        el.style.backgroundImage = `url('${node.image}')`;
        imgsLayer.appendChild(el);
      });

      const lockStart = NODES.findIndex(nd => nd.status === 'locked');
      if (lockStart < 0) {
        hideFog();
      } else {
        const fogLeft = Math.max(0, cx(lockStart) - step * CFG.fogLeadIn);
        buildFog(fogLeft, totalW - fogLeft, mapH);
      }

      nodesLayer.innerHTML = '';
      NODES.forEach((node, i) => {
        const el = document.createElement('div');
        el.className = 'map-node';
        el.style.left = cx(i) + 'px';
        el.style.top = iconTop(node.wave) + 'px';

        const color = statusColor(node.status);
        const icon = node.status === 'locked' ? ICONS.lock : ICONS.check;
        const title = node.title.replace(/\n/g, '<br>');
        const weight = node.status === 'active' ? '600' : '400';
        const titleColor = node.status === 'locked' ? '#dfe3e6' : '#fff';

        el.innerHTML = `
      <div class="node-icon ${node.status}">${icon}</div>
      <div>
        <p class="node-title" style="color:${titleColor}">${title}</p>
        <p class="node-status" style="color:${color};font-weight:${weight}">${node.statusLabel}</p>
      </div>`;
        nodesLayer.appendChild(el);
      });

      requestAnimationFrame(() => { drawPath(totalW, mapH); updateNavButtons(); });
    }

    function drawPath(totalW, mapH) {
      const cr = canvasEl.getBoundingClientRect();
      const pts = Array.from(nodesLayer.querySelectorAll('.node-icon')).map(ic => {
        const r = ic.getBoundingClientRect();
        return { x: r.left - cr.left + r.width / 2, y: r.top - cr.top + r.height / 2 };
      });

      pathSvg.setAttribute('viewBox', `0 0 ${totalW} ${mapH}`);
      pathSvg.setAttribute('width', totalW);
      pathSvg.setAttribute('height', mapH);
      pathSvg.style.width = totalW + 'px';
      pathSvg.style.height = mapH + 'px';

      const n = pts.length;
      if (n < 2) { pathSvg.innerHTML = ''; return; }

      let ls = NODES.findIndex(nd => nd.status === 'locked');
      if (ls < 0) ls = n;

      const mk = (from, to) => {
        if (from >= to) return '';
        let d = `M ${pts[from].x} ${pts[from].y}`;
        for (let i = from; i < to; i++) {
          const a = pts[i], b = pts[i + 1], cpx = (a.x + b.x) / 2;
          d += ` C ${cpx} ${a.y}, ${cpx} ${b.y}, ${b.x} ${b.y}`;
        }
        return d;
      };

      let svg = '';
      if (ls > 0)
        svg += `<path d="${mk(0, ls)}" fill="none" stroke="#d4b483" stroke-width="2.5" stroke-linecap="round" class="dash-gold"/>`;
      if (ls < n - 1)
        svg += `<path d="${mk(Math.max(ls - 1, 0), n - 1)}" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" class="dash-gray"/>`;

      pathSvg.innerHTML = svg;
    }

    function updateNavButtons() {
      const max = scrollEl.scrollWidth - scrollEl.clientWidth;
      const has = max > 4;
      btnLeft.classList.toggle('visible', has && scrollEl.scrollLeft > 4);
      btnRight.classList.toggle('visible', has && scrollEl.scrollLeft < max - 4);
    }

    scrollEl.addEventListener('scroll', updateNavButtons, { passive: true });
    btnLeft.addEventListener('click', () => scrollEl.scrollBy({ left: -CFG.nodeStep, behavior: 'smooth' }));
    btnRight.addEventListener('click', () => scrollEl.scrollBy({ left: CFG.nodeStep, behavior: 'smooth' }));

    let dragging = false, dragStartX = 0, scrollStart = 0;
    scrollEl.addEventListener('mousedown', e => {
      dragging = true; dragStartX = e.pageX; scrollStart = scrollEl.scrollLeft;
      scrollEl.style.cursor = 'grabbing';
    });
    window.addEventListener('mousemove', e => {
      if (!dragging) return;
      e.preventDefault();
      scrollEl.scrollLeft = scrollStart - (e.pageX - dragStartX);
    });
    window.addEventListener('mouseup', () => { dragging = false; scrollEl.style.cursor = 'grab'; });

    render();
    let rt;
    window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 120); });

    
  </script>
</body>

</html>
